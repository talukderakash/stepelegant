{% extends 'base.html' %}{% block title %}Shop All{% endblock %}{% block content %}<div class="page-banner"><span class="eyebrow">THE COLLECTION</span><h1>FIND YOUR <em>SOLE.</em></h1><p>Explore the latest from Step Elegant.</p></div><section class="section"><form class="filter-bar" method="get"><input name="q" placeholder="Search styles..." value="{{q}}"><select name="category"><option value="">All Categories</option>{% for c in categories %}<option value="{{c}}" {% if category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select><select name="sort"><option value="newest">Newest First</option><option value="price_low" {% if sort=='price_low' %}selected{% endif %}>Price: Low to High</option><option value="price_high" {% if sort=='price_high' %}selected{% endif %}>Price: High to Low</option></select><button class="btn dark" type="submit">FILTER ↗</button></form><div class="result-count">{{products|length}} PRODUCTS</div>{% include '_product_cards.html' %}</section>{% endblock %}
